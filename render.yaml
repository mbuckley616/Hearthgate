# Render blueprint: the game server and the client, both free, both redeployed on
# every push to main. Connect the repo once at https://dashboard.render.com
# (New > Blueprint > mbuckley616/Hearthgate > Apply).
#
# The server sleeps after 15 idle minutes and takes about a minute to wake. Render gave
# the server the host hearthgate-8lrq.onrender.com (plain "hearthgate" was taken), and the
# client bakes that in; change VITE_SERVER_URL here if the service is ever recreated.
services:
  - type: web
    name: hearthgate
    runtime: node
    plan: free
    region: ohio
    branch: main
    buildCommand: npm ci
    startCommand: npm run start:server
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      # The debug panel's cheats (skip a wave, spawn, kill all) work on the hosted build through Phase 1, for
      # side-by-side testing among friends. Remove this to turn them off; tuning edits stay either way.
      - key: HEARTHGATE_DEV
        value: "1"

  - type: web
    name: hearthgate-client
    runtime: static
    branch: main
    buildCommand: npm ci && npm run build
    staticPublishPath: client/dist
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: VITE_SERVER_URL
        value: wss://hearthgate-8lrq.onrender.com
