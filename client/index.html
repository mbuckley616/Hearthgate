<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Hearthgate</title>
    <style>
      :root {
        --ink: #f3efe4;
        --ink-soft: rgba(243, 239, 228, 0.72);
        --panel: rgba(28, 34, 24, 0.62);
        --player: #e8b24a;
        --enemy: #d96c6c;
        --good: #8fc67a;
        --safe-top: env(safe-area-inset-top, 0px);
        --safe-bottom: env(safe-area-inset-bottom, 0px);
      }
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #dfe9d6;
        font-family: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
        color: var(--ink);
      }
      #app canvas {
        display: block;
      }
      #hud {
        position: fixed;
        inset: 0;
        pointer-events: none;
        font-size: 15px;
        line-height: 1.3;
      }
      .hud-panel {
        position: absolute;
        background: var(--panel);
        border-radius: 10px;
        padding: 10px 14px;
        backdrop-filter: blur(4px);
        min-width: 180px;
      }
      .hud-top-left {
        top: calc(14px + var(--safe-top));
        left: 14px;
      }
      .hud-top-right {
        top: calc(14px + var(--safe-top));
        right: 14px;
        text-align: right;
      }
      .hud-bottom-right {
        position: absolute;
        bottom: calc(14px + var(--safe-bottom));
        right: 14px;
      }
      /* Ability slots: at least 48 px so a later touch layout can make them buttons as they are. */
      .hud-slots {
        display: flex;
        gap: 8px;
      }
      .hud-slot {
        position: relative;
        width: 56px;
        height: 56px;
        box-sizing: border-box;
        border-radius: 8px;
        background: rgba(20, 24, 18, 0.62);
        border: 2px solid rgba(255, 241, 194, 0.7);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        font-size: 11px;
        line-height: 1.2;
      }
      .hud-slot b {
        font-size: 15px;
      }
      .hud-slot.is-empty {
        opacity: 0.4;
        border-style: dashed;
      }
      .hud-slot.is-cooling {
        border-color: rgba(255, 255, 255, 0.2);
      }
      .hud-slot-cd {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 22px;
        font-weight: 700;
        pointer-events: none;
      }
      .hud-slot.is-cooling .hud-slot-cd {
        background: rgba(0, 0, 0, 0.5);
        border-radius: 6px;
      }
      .hud-bottom-left {
        bottom: calc(14px + var(--safe-bottom));
        left: 14px;
        display: flex;
        gap: 14px;
        flex-wrap: wrap;
        min-width: 0;
        /* Wrap before the ability slots: 14 px gutter, 184 px of slots, 14 px gutter, 14 px gap. */
        box-sizing: border-box;
        max-width: calc(100% - 226px);
        font-size: 13px;
        color: var(--ink-soft);
      }
      .hud-controls b {
        color: var(--ink);
        font-weight: 600;
      }
      .hud-name {
        font-weight: 600;
        font-size: 17px;
        margin-bottom: 4px;
      }
      .hud-sub {
        font-size: 13px;
        color: var(--ink-soft);
        margin-top: 6px;
      }
      .hud-bar {
        position: relative;
        height: 14px;
        width: 180px;
        background: rgba(0, 0, 0, 0.35);
        border-radius: 7px;
        overflow: hidden;
      }
      .hud-fill {
        position: absolute;
        inset: 0 auto 0 0;
        border-radius: 7px;
        transition: width 120ms linear;
      }
      .hud-fill-player {
        background: var(--player);
      }
      .hud-fill-enemy {
        background: var(--enemy);
      }
      .hud-bar span {
        position: absolute;
        inset: 0;
        font-size: 11px;
        line-height: 14px;
        text-align: center;
        color: var(--ink);
        text-shadow: 0 1px 1px rgba(0, 0, 0, 0.5);
      }
      .hud-log {
        position: absolute;
        right: 14px;
        /* Above the ability slots (56 px plus their gap). */
        bottom: calc(80px + var(--safe-bottom));
        text-align: right;
        font-size: 14px;
        color: var(--ink);
        text-shadow: 0 1px 2px rgba(0, 0, 0, 0.6);
      }
      .hud-log div {
        margin-top: 3px;
      }
      .hud-respawn {
        position: absolute;
        top: 32%;
        left: 0;
        right: 0;
        text-align: center;
        font-size: 28px;
        font-weight: 600;
        text-shadow: 0 2px 6px rgba(0, 0, 0, 0.6);
        display: none;
      }
      .hud-status {
        position: absolute;
        top: 40%;
        left: 50%;
        transform: translateX(-50%);
        background: var(--panel);
        padding: 14px 20px;
        border-radius: 10px;
        max-width: 80vw;
        text-align: center;
      }
      @media (max-width: 600px) {
        .hud-controls {
          display: none;
        }
        .hud-bar {
          width: 140px;
        }
        /* Portrait phones: the two top panels share ~360 px, so drop the desktop min-width
           and let the long net line wrap instead of sliding under the health bars. */
        .hud-panel {
          min-width: 0;
          padding: 8px 10px;
        }
        .hud-top-right {
          max-width: 36vw;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .hud-fill {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="hud"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
